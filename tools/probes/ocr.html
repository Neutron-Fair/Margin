<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>probe-ocr</title>
    <style>
      body { font: 13px monospace; padding: 12px; }
    </style>
  </head>
  <body>
    <div id="log">loading…</div>
    <canvas id="cv" width="920" height="240"></canvas>
    <script src="/__tesseract.js"></script>
    <script>
      const results = [];
      const ok = (name, pass, detail) => results.push({ name, pass, detail });
      const post = () => fetch('/__report?suite=ocr', { method: 'POST', body: JSON.stringify(results, null, 1) }).catch(() => {});
      const log = (m) => (document.getElementById('log').textContent = m);

      const draw = () => {
        const cv = document.getElementById('cv');
        const g = cv.getContext('2d');
        g.fillStyle = '#fff';
        g.fillRect(0, 0, cv.width, cv.height);
        g.fillStyle = '#000';
        g.font = 'bold 40px "Microsoft YaHei","SimHei",sans-serif';
        g.fillText('订单 1000 本', 30, 70);
        g.fillText('内页 80 克 210 x 148 mm', 30, 140);
        g.font = '32px "Microsoft YaHei",sans-serif';
        g.fillText('封面 250 克 覆膜 烫金', 30, 200);
      };

      (async () => {
        draw();
        const hasT = typeof window.Tesseract !== 'undefined';
        ok('ocr.lib-loaded', hasT, hasT ? 'ok' : 'missing');
        if (!hasT) { await post(); return; }

        const hasSimd = (() => {
          try {
            return WebAssembly.validate(new Uint8Array([0,97,115,109,1,0,0,0,1,5,1,96,0,1,123,3,2,1,0,10,10,1,8,0,65,0,253,15,253,98,11]));
          } catch (e) { return false; }
        })();
        ok('ocr.simd', true, `simd=${hasSimd}`);

        try {
          const worker = await Tesseract.createWorker('chi_sim', 1, {
            workerPath: '/tess/worker.min.js',
            corePath: hasSimd ? '/tess/tesseract-core-simd-lstm.wasm.js' : '/tess/tesseract-core-lstm.wasm.js',
            langPath: '/ocr',
            lstmOnly: true,
            logger: (m) => { if (m.status) log(m.status); },
          });
          const t0 = performance.now();
          const r = await worker.recognize(document.getElementById('cv'));
          const ms = Math.round(performance.now() - t0);
          await worker.terminate();
          const text = (r.data.text || '').replace(/\s+/g, ' ').trim();
          ok('ocr.recognize-nonempty', text.length > 0, `len=${text.length} ms=${ms}`);
          ok('ocr.contains-digits', /\d{2,}/.test(text), `digits=${(text.match(/\d{2,}/g) || []).join(',')}`);
          ok('ocr.text-sample', true, text.slice(0, 70));
        } catch (e) {
          ok('ocr.recognize-nonempty', false, 'ERR ' + (e && e.message ? e.message : e));
        }
        await post();
      })();
    </script>
  </body>
</html>
